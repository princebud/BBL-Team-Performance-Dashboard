name: Python checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m compileall -q .
      - run: pip install -r requirements.txt
      - run: python data_processing.py demo_data/demo_ball_by_ball.csv demo_data/demo_matches.csv --out output
